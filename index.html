function normalizeAnswer(x){return (x||'').toString().toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z\u4e00-\u9fff]/g,'');}
function answerStartsWithB(answer){return normalizeAnswer(answer).startsWith('b');}
function answerUsesVerb(answer,verb){const n=normalizeAnswer(answer);if(n.includes(verb))return true;return (VERB_PINYIN[verb]||[]).some(py=>n.includes(py));}
function attachEptValidation(fieldName,verb,isPractice=false){
 const form=document.querySelector('.jspsych-survey-html-form');if(!form)return;
 form.addEventListener('submit',function(ev){
  const input=form.querySelector(`[name="${fieldName}"]`);const raw=input?input.value.trim():'';const compact=normalizeAnswer(raw);
  let msg='';
  if(!answerStartsWithB(raw)) msg='请用B开头写句子。';
  else if(!answerUsesVerb(raw,verb)) msg=`请在句子中使用括号里的动词“${verb}”。不会写汉字时，可以写拼音。`;
  else if(compact.length<4) msg='请写一个完整句子，不要只写一个词或短语。';
  if(msg){ev.preventDefault();ev.stopImmediatePropagation();alert(msg);if(input)input.focus();}
 },true);
}
function noThreeSame(arr,key){for(let i=2;i<arr.length;i++)if(arr[i][key]===arr[i-1][key]&&arr[i][key]===arr[i-2][key])return false;return true}
function makeEptOrder(items){for(let attempt=0;attempt<3000;attempt++){let x=shuffle(items);let ok=true;for(let i=1;i<x.length;i++){if(x[i].scene===x[i-1].scene)ok=false;if(x[i].family&&x[i].family===x[i-1].family&&x[i].type==='target'&&x[i-1].type==='target')ok=false;}if(ok&&noThreeSame(x,'type'))return x;}return items;}
function blockIsGood(z,previous){
  for(let i=1;i<z.length;i++){
    if(z[i].variable&&z[i-1].variable&&z[i].variable===z[i-1].variable)return false;
    if(z[i].scene&&z[i-1].scene&&z[i].scene===z[i-1].scene)return false;
  }
  if(!noThreeSame(z,'condition'))return false;
  if(previous){
    if(previous.variable&&z[0].variable&&previous.variable===z[0].variable)return false;
    if(previous.scene&&z[0].scene&&previous.scene===z[0].scene)return false;
  }
  return true;
}
function makeAjtOrder(targets,fillers){
  const source=[...targets,...fillers];
  const kind=x=>x.variable?'target':'filler';
  const fits=(out,x)=>{
    const n=out.length,prev=n?out[n-1]:null;
    if(prev&&x.variable&&prev.variable&&x.variable===prev.variable)return false;
    if(prev&&x.scene&&prev.scene&&x.scene===prev.scene)return false;
    if(n>=2&&x.condition===out[n-1].condition&&x.condition===out[n-2].condition)return false;
    if(n>=2&&kind(x)===kind(out[n-1])&&kind(x)===kind(out[n-2]))return false;
    return true;
  };
  for(let attempt=0;attempt<5000;attempt++){
    const remaining=shuffle(source),out=[];
    while(remaining.length){
      const candidates=[];
      for(let i=0;i<remaining.length;i++)if(fits(out,remaining[i]))candidates.push(i);
      if(!candidates.length)break;
      const pick=candidates[Math.floor(Math.random()*candidates.length)];
      out.push(remaining.splice(pick,1)[0]);
    }
    if(out.length===source.length&&blockIsGood(out,null))return out;
  }
  throw new Error('无法生成满足AJT相邻约束的题目顺序');
}

function validateExperimentData(){
  const data=jsPsych.data.get();
  const groupRow=data.filter({trial_tag:'native_check'}).last(1).values()[0];
  const participantGroup=groupRow&&groupRow.is_native===true?'native':'L2';
  const counts={
    consent:data.filter({task_type:'consent'}).count(),
    native_check:data.filter({trial_tag:'native_check'}).count(),
    demographics_l2:data.filter({task_type:'demographics_L2'}).count(),
    demographics_native:data.filter({task_type:'demographics_native'}).count(),
    cloze:data.filter({task_type:'ClozCHI'}).count(),
    ept:data.filter({task_type:'EPT'}).count(),
    ajt:data.filter({task_type:'AJT'}).count()
  };
  const problems=[];
  if(counts.consent!==1) problems.push(`知情同意记录异常（${counts.consent}/1）`);
  if(counts.native_check!==1) problems.push(`母语筛查记录异常（${counts.native_check}/1）`);
  if(counts.ept!==eptItems.length) problems.push(`图片描述题数异常（${counts.ept}/${eptItems.length}）`);
  if(counts.ajt!==ajtItems.length) problems.push(`自然度判断题数异常（${counts.ajt}/${ajtItems.length}）`);
  if(participantGroup==='L2'){
    if(counts.demographics_l2!==1) problems.push(`二语者人口信息异常（${counts.demographics_l2}/1）`);
    if(counts.cloze!==cp.length) problems.push(`完形填空篇数异常（${counts.cloze}/${cp.length}）`);
  }else{
    if(counts.demographics_native!==1) problems.push(`母语者人口信息异常（${counts.demographics_native}/1）`);
    if(counts.cloze!==0) problems.push(`母语者不应出现完形填空记录（${counts.cloze}/0）`);
  }
  const eptRows=data.filter({task_type:'EPT'}).values();
  const missingEpt=eptRows.filter(row=>{
    const response=row.response||{};
    return !Object.values(response).some(v=>(v??'').toString().trim().length>0);
  }).length;
  if(missingEpt>0) problems.push(`图片描述任务有 ${missingEpt} 题缺少作答`);
  const ajtRows=data.filter({task_type:'AJT'}).values();
  const missingAjt=ajtRows.filter(row=>{
    const response=row.response||{};
    return !Object.values(response).some(v=>v!==null&&v!==undefined&&v!=='');
  }).length;
  if(missingAjt>0) problems.push(`自然度判断任务有 ${missingAjt} 题缺少评分`);
  return {valid:problems.length===0,participantGroup,counts,problems};
}

function downloadLocalBackup(){
  const blob=new Blob(['\ufeff'+jsPsych.data.get().csv()],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`${subject_id}_backup.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function uploadToDataPipe(){
  const response=await fetch('https://pipe.jspsych.org/api/data/',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      experimentID:DATA_PIPE_EXPERIMENT_ID,
      filename:upload_filename,
      data:jsPsych.data.get().csv()
    })
  });
  let result={};
  try{result=await response.json();}catch(e){}
  if(response.status===202) return {message:result.message||'Accepted',accepted:true,http_status:202};
  if(response.ok&&(result.message==='Success'||!result.error)) return {...result,http_status:response.status};
  if(result.error==='OSF_FILE_EXISTS') return {message:'Success',recoveredFrom:'OSF_FILE_EXISTS',http_status:response.status};
  const error=new Error(result.message||`上传失败（HTTP ${response.status}）`);
  error.code=result.error||`HTTP_${response.status}`;
  error.httpStatus=response.status;
  throw error;
}
